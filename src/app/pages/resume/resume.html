<div class="resume">

  <header class="sectionHead">
    <div>
      <span class="sectionHead__index">Document</span>
      <h1 class="sectionHead__title">Resume</h1>
    </div>
    <p class="sectionHead__note">View it inline below, or take the PDF with you.</p>
  </header>

  <div class="resume__actions">
    <button class="actionLink actionLink--primary" (click)="download()" type="button">
      Download PDF
      <span class="actionLink__arrow" aria-hidden="true">↓</span>
    </button>

    <a
      class="actionLink"
      [href]="resumeUrl"
      target="_blank"
      rel="noopener noreferrer"
    >Open in new tab <span class="actionLink__arrow" aria-hidden="true">→</span></a>
  </div>

  <!-- Full width rather than squeezed beside a sticky sidebar — the document
       is the page, so it gets the whole shell. -->
  <div class="resume__viewer">
    <iframe
      [src]="resumeUrl"
      title="Résumé of Micko Alberto"
      class="resume__iframe"
      loading="lazy"
    ></iframe>
  </div>

</div>
