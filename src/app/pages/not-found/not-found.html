<div class="notFound">

  <header class="sectionHead">
    <div>
      <span class="sectionHead__index">Error 404</span>
      <h1 class="sectionHead__title">This page doesn't exist.</h1>
    </div>
    <p class="sectionHead__note">
      The link may be outdated, or the address might have a typo.
    </p>
  </header>

  <!-- Interpolation, never innerHTML: this comes from the address bar, so
       Angular's escaping is what keeps it inert. Truncated as well, to cap how
       much arbitrary text a crafted link can put on the page. -->
  <p class="notFound__path" *ngIf="attemptedPath">
    <span class="notFound__pathLabel">Requested</span>
    <code class="notFound__pathValue">{{ attemptedPath }}</code>
  </p>

  <section class="notFound__suggest" aria-labelledby="suggestTitle">
    <h2 class="notFound__suggestTitle" id="suggestTitle">Try one of these</h2>

    <ol class="destList">
      <li class="destItem" *ngFor="let d of destinations; let i = index">
        <span class="destItem__num" aria-hidden="true">{{ index(i) }}</span>

        <h3 class="destItem__title">
          <a class="destItem__link" [routerLink]="d.path">{{ d.label }}</a>
        </h3>

        <p class="destItem__desc">{{ d.desc }}</p>
      </li>
    </ol>
  </section>

</div>
