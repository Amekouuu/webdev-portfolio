<div class="blog">

  <header class="sectionHead">
    <div>
      <span class="sectionHead__index">Writing</span>
      <h1 class="sectionHead__title">Blog</h1>
    </div>
    <p class="sectionHead__note">
      Web development and its stories, written from my perspective.
    </p>
  </header>

  <!-- A numbered index, matching Selected work on the home page. Each post
       used to sit in its own rounded card with its tags rendered as pills. -->
  <ol class="postList">
    <li class="postItem" *ngFor="let post of posts; let i = index">

      <span class="postItem__num" aria-hidden="true">
        {{ (i + 1).toString().padStart(2, '0') }}
      </span>

      <div class="postItem__body">
        <h2 class="postItem__title">
          <a class="postItem__link" [routerLink]="['/blog', post.slug]">{{ post.title }}</a>
        </h2>

        <p class="postItem__summary">{{ post.summary }}</p>

        <ul class="toolList postItem__tags" [attr.aria-label]="post.title + ' topics'">
          <li *ngFor="let tag of post.tags">{{ tag }}</li>
        </ul>
      </div>

      <div class="postItem__meta">
        <time class="postItem__date" [attr.datetime]="post.date">
          {{ post.date | date:'mediumDate' }}
        </time>
        <span class="postItem__read">{{ post.readMinutes }} min read</span>
      </div>

    </li>
  </ol>

</div>
