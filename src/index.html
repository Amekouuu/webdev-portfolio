       phones in dark mode would paint a navy address bar over a light page.
  <meta name="theme-color" content="#070c18" media="(prefers-color-scheme: dark)">
  -->

  <!-- Applies the saved/OS theme before first paint. Prerendered HTML ships with
       no data-theme, so without this a dark-mode visitor sees a light flash
       until Angular hydrates. Key must match ThemeService.STORAGE_KEY. -->
  <script>
    (function () {
      // Marks JS as available before first paint. Scroll-reveal CSS keys off
      // this so prerendered HTML is visible to crawlers and no-JS visitors.
      document.documentElement.classList.add('js');
      try {
        // Keep in sync with ThemeService.DARK_MODE_ENABLED.
        var DARK_MODE_ENABLED = false;
        var k = 'portfolio-theme';
        var t = localStorage.getItem(k);
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (!DARK_MODE_ENABLED) t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* private mode / storage blocked — fall through to CSS defaults */
      }
    })();
  </script>

  <!-- Google Analytics 4. The Measurement ID is public by design — it ships in
       every page's source. Commands queue in dataLayer straight away, but the
       176 KB gtag.js is fetched only after load + idle: as an async <script>
       it competed with fonts and the app bundle for a phone's bandwidth and
       pushed text paint out by seconds. GA replays the queue when it lands,
       so the page_view (and its original timestamp) is still recorded. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-DVP5XGRF9Z');
    addEventListener('load', function () {
      var load = function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DVP5XGRF9Z';
        document.head.appendChild(s);
      };
      if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
      else setTimeout(load, 1500);
    });
  </script>

  <!-- Self-hosted fonts (SIL OFL), latin subset only: 72 KB in three files,
       from this origin, so no extra DNS/TLS round trips to Google before text
       can paint. Only the styles the CSS draws: JetBrains Mono 400/700/800 (one
       variable file; 800 is its heaviest, so --weight-black 900 renders as 800)
       and Fraunces 800 upright + 400 italic. A serif weight not listed here
       renders as the nearest one: add a file before using a new weight.
       The two faces the first screen needs are preloaded. -->
  <link rel="preload" href="/assets/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/fraunces-800.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url("/assets/fonts/jetbrains-mono.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face{
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url("/assets/fonts/fraunces-800.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face{
      font-family: "Fraunces";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/assets/fonts/fraunces-400-italic.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* Metric-matched fallbacks: until the web font arrives, text is drawn in a
       local font scaled to the same width and line metrics, so the swap does
       not reflow the page (it was the /resume layout shift). Measured against
       the web fonts with canvas measureText. local() that is not installed is
       skipped, falling through to the next family in the stack. */
    @font-face{
      font-family: "JetBrains Mono Fallback Consolas";
      src: local("Consolas");
      size-adjust: 109.13%;
      ascent-override: 93.47%;
      descent-override: 27.49%;
      line-gap-override: 0%;
    }
    @font-face{
      font-family: "JetBrains Mono Fallback";
      src: local("Menlo"), local("Courier New");
      size-adjust: 100%;
      ascent-override: 102.02%;
      descent-override: 30%;
      line-gap-override: 0%;
    }
    @font-face{
      font-family: "Fraunces Fallback";
      src: local("Georgia");
      size-adjust: 98.41%;
      ascent-override: 99.58%;
      descent-override: 26.42%;
      line-gap-override: 0%;
    }
  </style>
