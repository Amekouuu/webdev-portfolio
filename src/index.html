  <!-- Applies the saved/OS theme before first paint. Prerendered HTML ships with
       no data-theme, so without this a dark-mode visitor sees a light flash
       until Angular hydrates. Key must match ThemeService.STORAGE_KEY. -->
  <script>
    (function () {
      // Marks JS as available before first paint. Scroll-reveal CSS keys off
      // this so prerendered HTML is visible to crawlers and no-JS visitors.
      document.documentElement.classList.add('js');
      try {
        var k = 'portfolio-theme';
        var t = localStorage.getItem(k);
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* private mode / storage blocked — fall through to CSS defaults */
      }
    })();
  </script>
